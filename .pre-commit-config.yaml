# Google-style gate, from the shared toolchain (repo-audit-2026-10-05).
# Install once per clone: `uvx pre-commit install`
# The shell and JavaScript hooks are left out: this repo has neither.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013, --]   # line length handled by editorconfig
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: (fixtures|data.*|manifest.*\.jsonl|uv\.lock|package-lock\.json)
