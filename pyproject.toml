[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "n-in-a-row"
version = "1.0.0"
description = "Generalised n-in-a-row: engine, search, CLI, GUI and an RL environment"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
rl = ["numpy>=1.20"]
# Everything the test suite needs. The env tests skip without NumPy locally but
# fail when the CI environment variable is set (see README, "Tests").
test = ["numpy>=1.20"]

[project.scripts]
n-in-a-row = "n_in_a_row.cli:main"
n-in-a-row-gui = "n_in_a_row.gui:main"

[tool.setuptools]
packages = ["n_in_a_row"]
