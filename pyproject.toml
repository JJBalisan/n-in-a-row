[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tictactoe"
version = "1.0.0"
description = "Generalised n-in-a-row: engine, search, CLI, GUI and an RL environment"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
rl = ["numpy>=1.20"]
# Everything the test suite needs. The env tests skip without NumPy locally but
# fail when the CI environment variable is set (see README, "Tests").
test = ["numpy>=1.20"]

[project.scripts]
tictactoe = "tictactoe.cli:main"
tictactoe-gui = "tictactoe.gui:main"

[tool.setuptools]
packages = ["tictactoe"]
