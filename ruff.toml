# Shared ruff config approximating the Google Python Style Guide.
# https://google.github.io/styleguide/pyguide.html
# Copied from the shared toolchain (repo-audit-2026-10-05) and adjusted for
# this repo. This file is the only ruff config: pyproject.toml has none.
line-length = 80          # pyguide 3.2
indent-width = 4          # pyguide 3.4
target-version = "py39"   # matches requires-python >=3.9
extend-exclude = [".venv", "vendor", "data", "out", "work", "fixtures"]

[format]
quote-style = "preserve"  # pyguide 3.10 lets you pick; stay consistent per file
docstring-code-format = true

[lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort            (pyguide 3.13 import grouping/order)
  "N",        # pep8-naming      (pyguide 3.16)
  "D",        # pydocstyle       (pyguide 3.8, Google convention below)
  "B",        # bugbear          (mutable defaults 2.12, etc.)
  "UP",       # pyupgrade
  "ANN",      # annotations      (pyguide 2.21 / 3.19, public APIs)
  "S",        # bandit           (security smell)
  "A",        # builtins shadowing
  "C4",       # comprehensions   (pyguide 2.7)
  "SIM",      # simplify
  "RET",      # returns
  "ARG",      # unused args
  "PL",       # pylint subset    (function length etc.)
  "T20",      # print found (use logging in libraries)
  "BLE",      # blind except     (pyguide 2.4)
  "G",        # logging format   (pyguide 3.10.1)
  "ICN",      # import conventions
  "TID",      # tidy imports (bans relative imports; pyguide 2.2)
  "PIE",      # kept from this repo's earlier pyproject config
  "RUF",      # kept from this repo's earlier pyproject config
]
ignore = [
  "D105", "D107",       # magic methods / __init__ docstrings not required
  "ANN401",             # Any is sometimes unavoidable
  "PLR0913", "PLR2004", # arg-count and magic-number are judgment calls
  "S101",               # assert is fine in tests (see per-file-ignores)
  "E501",               # let the formatter own line length, re-enable later
  "RET504",             # a named return value is often clearer than inlining it
  "SIM108",             # ternaries are not always more readable
]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["tictactoe", "examples", "fake_agent"]
combine-as-imports = true

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.pylint]
max-statements = 50      # ~ pyguide 3.18 "about 40 lines"

[lint.per-file-ignores]
# E402: sys.path is set up before the package imports.
# PLC0415: NumPy and tkinter tests import lazily so they can skip.
"tests/**" = ["D", "ANN", "S101", "PLR", "ARG", "E402", "PLC0415"]
"examples/**" = ["T20", "D", "E402"]
"tictactoe/cli.py" = ["T20"]   # printing is the command line's job
